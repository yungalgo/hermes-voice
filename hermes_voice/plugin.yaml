name: voice-platform
label: Voice
kind: platform
version: 0.2.0
description: >
  Realtime voice-call gateway adapter. Joins a Daily (WebRTC) room as a
  participant, streams caller audio to Deepgram Flux (streaming STT with
  model-integrated turn detection), runs one fresh agent turn per utterance
  with token streaming, and speaks replies through Cartesia (streaming TTS)
  with sentence-level latency and in-process barge-in.

  Standalone mode: this agent holds DAILY_API_KEY and creates its own private
  room + single-use meeting token at startup, then logs a shareable URL.

  Orchestrated mode: this agent opens an authenticated outbound signaling
  stream and joins rooms assigned by the controller.
author: yungalgo
requires_env:
  - name: CARTESIA_API_KEY
    description: "Cartesia API key (streaming TTS and optional Ink STT)"
    prompt: "Cartesia API key"
    password: true
optional_env:
  - name: DAILY_API_KEY
    description: "Daily API key (standalone mode only — agent creates its own room)"
    prompt: "Daily API key (standalone mode only)"
    password: true
  - name: DEEPGRAM_API_KEY
    description: "Deepgram API key (only for stt_provider: deepgram_flux)"
    prompt: "Deepgram API key (skip for stt_provider: cartesia_ink)"
    password: true
  - name: SECOND_BRAIN_SIGNALING_URL
    description: "Outbound SSE/POST endpoint (orchestrated mode only)"
    prompt: "Second Brain signaling URL (orchestrated mode only)"
    password: false
  - name: SECOND_BRAIN_SIGNALING_KEY
    description: "Dedicated bearer key for outbound signaling (orchestrated mode only)"
    prompt: "Second Brain signaling key (orchestrated mode only)"
    password: true
  - name: CARTESIA_VOICE_ID
    description: "Cartesia TTS voice id (or set platforms.voice.extra.cartesia_voice_id)"
    prompt: "Cartesia voice id (or empty for default)"
    password: false
  - name: VOICE_MODEL_PROVIDER
    description: "Dedicated low-latency model for voice turns — provider (or set platforms.voice.extra.voice_model)"
    prompt: "Voice model provider (or empty to use the main model)"
    password: false
  - name: VOICE_MODEL_NAME
    description: "Dedicated low-latency model for voice turns — model name"
    prompt: "Voice model name (or empty to use the main model)"
    password: false
